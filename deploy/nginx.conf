# Tunnelly — nginx alternative. Put in /etc/nginx/conf.d/tunnelly.conf
#
# Certificates: get a wildcard cert with certbot + your DNS plugin, e.g.
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
#     -d example.com -d '*.example.com'
#
# Replace example.com with your DOMAIN.

# Required for WebSocket upgrades: forward "Connection: upgrade" only when the
# client asked for an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com *.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com *.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Keep in sync with MAX_REQUEST_BODY_MB.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket upgrades (CLI control connection + forwarded app WebSockets).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Tunnelly routes by Host — it must be preserved.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Long-lived tunnel connections and streaming bodies.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
